name: Seso
description: 'Seso is an all-in-one employee management platform built for U.S. agricultural
  operations, serving customers across all 50 states including 35 of the top 100 agricultural
  employers. Its software combines a modern farm HR system, compliant digital onboarding
  (I-9/W-4 with direct E-Verify integration), H-2A visa filing and compliance backed
  by legal resources, self-serve and managed payroll, and digital paycards for paycheck
  delivery. Seso also provides H-2A worker services such as consulate scheduling, recruiting,
  and logistics coordinated from its Monterrey, Mexico office. Backed by Bond Capital
  and Index Ventures. No public developer API is currently published.'
